image: archlinux
packages:
  - go
  - podman
sources:
  - https://github.com/go-ap/fedbox
secrets:
- 3dcea276-38d6-4a7e-85e5-20cbc903e1ea
tasks:
  - setup: |
      test ${BUILD_SUBMITTER} != "git.sr.ht" && complete-build
      cd fedbox && make download
  - build: |
      cd fedbox
      make STORAGE=fs clean all
      make STORAGE=boltdb clean all
      make STORAGE=sqlite clean all
      make STORAGE=all clean all
  - tests: |
      cd fedbox
      make test
  - coverage: |
      set -a +x
      cd fedbox
      make coverage
  - integration-new-setup: |
      systemctl --user start podman.socket
      cd fedbox
      make -C integration download
  - integration-new-fs: |
      cd fedbox
      make STORAGE=fs TAGS=Fetch,Filter,Outbox -C integration test
      make STORAGE=fs TAGS=Create,Update,Delete -C integration test
      make STORAGE=fs TAGS=Add,Move,Remove -C integration test
      make STORAGE=fs TAGS=Like,Share,Follow -C integration test
      make STORAGE=fs TAGS=Ignore,Block -C integration test
      make STORAGE=fs TAGS=Question -C integration test
      make TAGS=ssh STORAGE=fs -C integration test
      make TAGS=s2s STORAGE=fs -C integration test
  - integration-new-badger: |
      cd fedbox
      make STORAGE=badger TAGS=Fetch,Filter,Outbox -C integration test
      make STORAGE=badger TAGS=Create,Update,Delete -C integration test
      make STORAGE=badger TAGS=Add,Move,Remove -C integration test
      make STORAGE=badger TAGS=Like,Share,Follow -C integration test
      make STORAGE=badger TAGS=Ignore,Block -C integration test
      make STORAGE=badger TAGS=Question -C integration test
      make TAGS=ssh STORAGE=badger -C integration test
      make TAGS=s2s STORAGE=badger -C integration test
  - integration-new-boltdb: |
      cd fedbox
      make STORAGE=boltdb TAGS=Fetch,Filter,Outbox -C integration test
      make STORAGE=boltdb TAGS=Create,Update,Delete -C integration test
      make STORAGE=boltdb TAGS=Add,Move,Remove -C integration test
      make STORAGE=boltdb TAGS=Like,Share,Follow -C integration test
      make STORAGE=boltdb TAGS=Ignore,Block -C integration test
      make STORAGE=boltdb TAGS=Question -C integration test
      make TAGS=ssh STORAGE=boltdb -C integration test
      make TAGS=s2s STORAGE=boltdb -C integration test
  - integration-new-sqlite: |
      cd fedbox
      make STORAGE=sqlite TAGS=Fetch,Filter,Outbox -C integration test
      make STORAGE=sqlite TAGS=Create,Update,Delete -C integration test
      make STORAGE=sqlite TAGS=Add,Move,Remove -C integration test
      make STORAGE=sqlite TAGS=Like,Share,Follow -C integration test
      make STORAGE=sqlite TAGS=Ignore,Block -C integration test
      make STORAGE=sqlite TAGS=Question -C integration test
      make TAGS=ssh STORAGE=sqlite -C integration test
      make TAGS=s2s STORAGE=sqlite -C integration test
  - push_to_github: |
      test ${BUILD_SUBMITTER} != "git.sr.ht" && complete-build
      set -a +x
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      cd fedbox
      git remote add hub git@github.com:go-ap/fedbox
      git push hub --force --all
  - integration-fs: |
      cd fedbox
      ./tools/run-tests.sh fs
  - integration-boltdb: |
      cd fedbox
      ./tools/run-tests.sh boltdb
  - integration-sqlite: |
      cd fedbox
      ./tools/run-tests.sh sqlite
  - integration-badger: |
      cd fedbox
      ./tools/run-tests.sh badger
